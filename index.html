<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotas de Coleta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1f24;--mut:#6a7280;--bd:#dde1e7;--ac:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#9aa1ad;--bd:#303540;--ac:#e5675a}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:12px 16px;flex-wrap:wrap}
h1{font-size:18px;margin:0 12px 0 0}main{padding:0 16px 24px;max-width:1300px;margin:auto}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:120px}
.mut{color:var(--mut);font-size:13px}.hide{display:none}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.stop{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.num{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:6px 9px}
button{cursor:pointer}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{border:1px solid var(--bd);border-radius:7px;padding:5px 9px;font-size:13px;text-decoration:none;color:var(--tx)}
input{width:100%;box-sizing:border-box;margin:4px 0 8px}label{font-size:13px;color:var(--mut)}
#mapa{height:calc(100vh - 120px);min-height:380px;border-radius:8px;position:sticky;top:8px}#fmap{height:300px;border-radius:8px;margin-bottom:8px}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 12px system-ui;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
</style></head><body>
<div id="login" class="hide card"><h1>🩸 Rotas de Coleta</h1><label>E-mail</label><input id="em" type="email"><label>Senha</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()"><button class="pri" onclick="doLogin()">Entrar</button> <span id="lerr" class="mut"></span></div>
<div id="app" class="hide">
<header><h1>🩸 Rotas de Coleta</h1>
<div class="tabs row"><button id="t-rotas" onclick="tab('rotas')">Rotas</button><button id="t-pac" onclick="tab('pac')">Pacientes</button><button id="t-col" onclick="tab('col')">Coletadores</button></div>
<span id="live" class="mut"></span><button onclick="logout()" style="margin-left:auto">Sair</button></header>
<main>
<section id="v-rotas"><div class="row" style="margin-bottom:10px"><label>Data da rota</label><input type="date" id="dt" style="width:auto;margin:0" onchange="D=this.value;fit=true;load()"></div>
<div class="grid"><div id="rotas"></div><div><div id="mapa"></div></div></div></section>
<section id="v-pac" class="hide"><div class="grid"><div class="card"><b id="ftit">Novo paciente</b><br>
<label>Nome</label><input id="pn"><label>Telefone</label><input id="pt"><label>Endereço completo</label><input id="pa" placeholder="Rua, número, bairro, cidade">
<div class="row"><button onclick="geo()">Buscar endereço no mapa</button><span id="gmsg" class="mut"></span></div>
<p class="mut">Confira o pino: clique no mapa ou arraste o pino até o local exato.</p>
<div id="fmap"></div><div id="pcoord" class="mut" style="margin-bottom:8px">Sem local marcado.</div>
<div class="row"><button class="pri" onclick="savePat()">Salvar</button><button onclick="clearForm()">Limpar</button></div></div>
<div><input id="q" placeholder="Buscar paciente…" oninput="renderPat()"><div id="plist"></div></div></div></section>
<section id="v-col" class="hide"><div class="card" style="max-width:520px"><div class="row"><input id="cn" placeholder="Nome do novo coletador" style="margin:0" class="grow"><button class="pri" onclick="addCol()">Adicionar</button></div></div><div id="clist" style="max-width:520px"></div></section>
</main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== COLE AQUI os dados do seu projeto Supabase ======
const SUPABASE_URL="https://gqpvcqztxbyafkhcvawm.supabase.co",SUPABASE_KEY="sb_publishable_4i3KzIZOGcDj935Zvwx5QA__rHFV1b1";
// ========================================================
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const COLORS=["#c0392b","#2874a6","#1e8449","#b9770e","#7d3c98","#117a8b"];
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toLocaleDateString("sv-SE")};
let P=[],C=[],T=[],D=tomorrow(),editId=null,pin=null,fit=true,mm,ml,fm,fmk,tm;
const pt=id=>P.find(p=>p.id===id);
const stopsOf=cid=>T.filter(s=>s.collector_id===cid).sort((a,b)=>a.position-b.position);
const tiles=m=>L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
const icon=(col,t)=>L.divIcon({className:"",html:`<div class="pin" style="background:${col}">${t}</div>`,iconSize:[26,26],iconAnchor:[13,13]});

async function boot(){const{data:{session}}=await db.auth.getSession();session?enter():$("login").classList.remove("hide")}
async function doLogin(){const{error}=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error){$("lerr").textContent="E-mail ou senha inválidos.";return}$("login").classList.add("hide");enter()}
async function logout(){await db.auth.signOut();location.reload()}
function enter(){$("login").classList.add("hide");$("app").classList.remove("hide");$("dt").value=D;
mm=L.map("mapa").setView([-7.23,-35.88],12);tiles(mm);ml=L.layerGroup().addTo(mm);tab("rotas");load();
db.channel("live").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(tm);tm=setTimeout(load,150)}).subscribe(s=>{$("live").textContent=s==="SUBSCRIBED"?"● ao vivo":"○ reconectando…"})}
async function load(){const[p,c,t]=await Promise.all([db.from("patients").select("*").order("name"),db.from("collectors").select("*").order("created_at"),db.from("stops").select("*").eq("route_date",D)]);
const e=p.error||c.error||t.error;if(e){alert("Erro: "+e.message);return}P=p.data;C=c.data;T=t.data;render()}
async function go(...qs){const r=await Promise.all(qs);r.forEach(x=>{if(x&&x.error)alert(x.error.message)});load()}
function tab(t){["rotas","pac","col"].forEach(k=>{$("v-"+k).classList.toggle("hide",k!==t);$("t-"+k).classList.toggle("on",k===t)});
if(t==="rotas")setTimeout(()=>mm.invalidateSize(),50);
if(t==="pac"){if(!fm){fm=L.map("fmap").setView([-7.23,-35.88],12);tiles(fm);fm.on("click",e=>setPin(e.latlng.lat,e.latlng.lng))}setTimeout(()=>fm.invalidateSize(),50)}}
function render(){renderRotas();renderPat();renderCol()}

function dirUrl(list){const q=list.map(s=>pt(s.patient_id)).filter(Boolean).map(p=>p.lat+","+p.lng);if(!q.length)return"#";
return"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+q[q.length-1]+(q.length>1?"&waypoints="+q.slice(0,-1).join("%7C"):"")}
function renderRotas(){const used=new Set(T.map(s=>s.patient_id)),free=P.filter(p=>!used.has(p.id));let h="";
C.forEach(c=>{const list=stopsOf(c.id);
h+=`<div class="card"><div class="row"><span class="dot" style="background:${c.color}"></span><b class="grow">${esc(c.name)} <span class="mut">· ${list.length} paradas</span></b><a class="btn" target="_blank" rel="noopener" href="${dirUrl(list)}">Abrir no Google Maps</a></div>`;
list.forEach((s,i)=>{const p=pt(s.patient_id);if(!p)return;
h+=`<div class="stop"><span class="num" style="background:${c.color}">${i+1}</span><div class="grow" style="cursor:pointer" onclick="mm.flyTo([${p.lat},${p.lng}],16)"><b>${esc(p.name)}</b><div class="mut">${esc(p.address)}</div></div><button onclick="mv('${s.id}',-1)">↑</button><button onclick="mv('${s.id}',1)">↓</button><select onchange="mvTo('${s.id}',this.value)"><option value="">Mover…</option>${C.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><button onclick="rm('${s.id}')">✕</button></div>`});
h+="</div>"});
h+=`<div class="card"><b>Pacientes sem coletador (${free.length})</b>`;
free.forEach(p=>{h+=`<div class="stop"><div class="grow"><b>${esc(p.name)}</b><div class="mut">${esc(p.address)}</div></div><select onchange="assign('${p.id}',this.value)"><option value="">Atribuir a…</option>${C.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>`});
$("rotas").innerHTML=h+"</div>";drawMap()}
function drawMap(){ml.clearLayers();const pts=[],used=new Set(T.map(s=>s.patient_id));
P.filter(p=>!used.has(p.id)).forEach(p=>{L.circleMarker([p.lat,p.lng],{radius:6,color:"#fff",weight:2,fillColor:"#9aa1ad",fillOpacity:1}).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.address)}<br><i>sem coletador</i>`).addTo(ml);pts.push([p.lat,p.lng])});
C.forEach(c=>{const ps=stopsOf(c.id).map(s=>pt(s.patient_id)).filter(Boolean);
if(ps.length>1)L.polyline(ps.map(p=>[p.lat,p.lng]),{color:c.color,weight:3,dashArray:"6 6",opacity:.8}).addTo(ml);
ps.forEach((p,i)=>{L.marker([p.lat,p.lng],{icon:icon(c.color,i+1)}).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.address)}<br>${esc(c.name)} · parada ${i+1}`).addTo(ml);pts.push([p.lat,p.lng])})});
if(fit&&pts.length){mm.fitBounds(pts,{padding:[40,40],maxZoom:16});fit=false}}
function assign(pid,cid){if(cid)go(db.from("stops").insert({route_date:D,collector_id:cid,patient_id:pid,position:stopsOf(cid).length}))}
function mv(id,d){const s=T.find(x=>x.id===id),arr=stopsOf(s.collector_id),i=arr.indexOf(s),j=i+d;if(j<0||j>=arr.length)return;
[arr[i],arr[j]]=[arr[j],arr[i]];go(...arr.map((x,k)=>x.position!==k?db.from("stops").update({position:k}).eq("id",x.id):null).filter(Boolean))}
function mvTo(id,cid){if(cid)go(db.from("stops").update({collector_id:cid,position:stopsOf(cid).length}).eq("id",id))}
function rm(id){go(db.from("stops").delete().eq("id",id))}

function showPin(){$("pcoord").textContent=pin?"Local marcado: "+pin[0].toFixed(6)+", "+pin[1].toFixed(6):"Sem local marcado."}
function setPin(a,b,zoom){pin=[a,b];if(!fmk){fmk=L.marker([a,b],{draggable:true,icon:icon("#c0392b","•")}).addTo(fm);fmk.on("dragend",()=>{const q=fmk.getLatLng();pin=[q.lat,q.lng];showPin()})}else fmk.setLatLng([a,b]);if(zoom)fm.setView([a,b],17);showPin()}
async function geo(){const a=$("pa").value.trim();if(!a)return;$("gmsg").textContent="Buscando…";
try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q="+encodeURIComponent(a)),j=await r.json();
if(j[0]){setPin(+j[0].lat,+j[0].lon,true);$("gmsg").textContent="Encontrado. Confira o pino."}else $("gmsg").textContent="Não encontrado. Clique no mapa para marcar."}catch(e){$("gmsg").textContent="Falha na busca. Clique no mapa para marcar."}}
async function savePat(){const n=$("pn").value.trim();if(!n){alert("Informe o nome.");return}if(!pin){alert("Marque o local no mapa.");return}
const o={name:n,phone:$("pt").value.trim(),address:$("pa").value.trim(),lat:pin[0],lng:pin[1]};
const{error}=editId?await db.from("patients").update(o).eq("id",editId):await db.from("patients").insert(o);
if(error){alert(error.message);return}clearForm();load()}
function clearForm(){editId=null;pin=null;["pn","pt","pa"].forEach(i=>$(i).value="");$("ftit").textContent="Novo paciente";$("gmsg").textContent="";if(fmk){fm.removeLayer(fmk);fmk=null}showPin()}
function editPat(id){const p=pt(id);editId=id;$("pn").value=p.name;$("pt").value=p.phone||"";$("pa").value=p.address||"";$("ftit").textContent="Editar paciente";setPin(p.lat,p.lng,true);window.scrollTo(0,0)}
function delPat(id){if(confirm("Excluir este paciente (e suas paradas)?"))go(db.from("patients").delete().eq("id",id))}
function renderPat(){const q=$("q").value.toLowerCase();
$("plist").innerHTML=P.filter(p=>(p.name+" "+(p.address||"")).toLowerCase().includes(q)).map(p=>`<div class="card row"><div class="grow"><b>${esc(p.name)}</b><div class="mut">${esc(p.address)} ${esc(p.phone)}</div></div><button onclick="editPat('${p.id}')">Editar</button><button onclick="delPat('${p.id}')">✕</button></div>`).join("")||'<p class="mut">Nenhum paciente.</p>'}

function addCol(){const n=$("cn").value.trim();if(!n)return;$("cn").value="";go(db.from("collectors").insert({name:n,color:COLORS[C.length%COLORS.length]}))}
function renCol(id,v){if(v.trim())go(db.from("collectors").update({name:v.trim()}).eq("id",id))}
function delCol(id){if(confirm("Remover coletador e as paradas dele?"))go(db.from("collectors").delete().eq("id",id))}
function renderCol(){$("clist").innerHTML=C.map(c=>`<div class="card row"><span class="dot" style="background:${c.color}"></span><input class="grow" style="margin:0" value="${esc(c.name)}" onchange="renCol('${c.id}',this.value)"><button onclick="delCol('${c.id}')">✕</button></div>`).join("")}
boot();
</script></body></html>
